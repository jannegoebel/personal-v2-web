# Cache policy by path. Kept in a map rather than per-location `add_header`
# calls because a location that sets any header discards every header
# inherited from the server block -- routing the value through one variable
# keeps the security headers below applying everywhere.
#
# $uri is post-rewrite, so a deep route that fell through to the SPA shell is
# matched here as /index.html and correctly marked no-store.
map $uri $cache_control {
    # Unhashed: /images and /textures are copied verbatim from public/, so the
    # same URL can serve new bytes after a deploy -- revalidate every time.
    default       "public, max-age=0, must-revalidate";

    # Vite fingerprints everything under /assets, so the URL changes whenever
    # the content does and these can never go stale.
    ~^/assets/    "public, max-age=31536000, immutable";

    # The entry point is what points at the current hashed bundle; a cached
    # copy would pin visitors to the previous deploy.
    /index.html   "no-store";
    /healthz      "no-store";
}

server {
    listen 80;
    # The image's entrypoint only injects this into its own stock config, not a
    # mounted one, and the healthcheck's `localhost` resolves to ::1 first --
    # without it every check fails against an IPv4-only listener.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind the reverse proxy the peer is always the proxy, so log the
    # forwarded client instead -- otherwise every access line reads as the
    # Docker bridge gateway.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.16.0.0/12;
    real_ip_recursive on;

    # The only add_header block in the file -- see the note on the map above.
    # TLS terminates at the proxy; these are the headers it cannot set for us.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Liveness for HEALTHCHECK and the proxy. Serves the shell rather than a
    # canned 200: a static string would report healthy against an empty
    # document root, which is the one failure a runtime check is here to
    # catch. access_log is off so the 30s poll does not drown real traffic.
    location = /healthz {
        access_log off;
        try_files /index.html =503;
    }

    # A miss here is a stale reference to a deleted bundle, not a route -- 404
    # rather than let it fall through and hand the browser HTML for a .js URL.
    location /assets/ {
        try_files $uri =404;
    }

    # Client-side routing: /contact, /projects/$id etc. exist only in the
    # TanStack router, so any unmatched path has to fall through to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
